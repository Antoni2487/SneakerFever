# Configuración SOLO para tests. Tiene el mismo nombre que la de la app, así que
# en el classpath de test la reemplaza: los tests nunca tocan tu MySQL local ni
# necesitan secretos reales (y corren igual en CI, donde no hay
# src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:sneakerfever-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

upload.path=target/test-uploads

miapi.token=test-token
miapi.url.dni=http://localhost:0/dni/
miapi.url.ruc=http://localhost:0/ruc/

jwt.secret=secreto-solo-para-tests-0123456789abcdefghijklmnop
jwt.cookie.secure=false
