spring.jpa.hibernate.ddl-auto=update
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/sneakerfever?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_PASSWORD

spring.jpa.show-sql=true
upload.path=TU_RUTA_LOCAL_DE_UPLOADS

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

miapi.token=TU_TOKEN_AQUI
miapi.url.dni=https://miapi.cloud/v1/dni/
miapi.url.ruc=https://miapi.cloud/v1/ruc/

# JWT (login del frontend React) — ver AUDITORIA_INTEGRAL.md seccion 9, Bloque A.
# jwt.secret: clave HMAC para firmar los tokens (HS256). Debe tener AL MENOS 32
# caracteres/bytes o Keys.hmacShaKeyFor() lanza WeakKeyException al arrancar.
# Generar uno propio, por ejemplo: openssl rand -base64 48
# NUNCA reusar el valor de este archivo de ejemplo en un entorno real.
jwt.secret=CAMBIA_ESTO_POR_UN_SECRETO_ALEATORIO_DE_AL_MENOS_32_CARACTERES_LARGO
jwt.access-token.expiration-minutes=30
jwt.refresh-token.expiration-days=7
# jwt.cookie.secure: en true, la cookie httpOnly del refresh token solo viaja
# por HTTPS. Debe ser true en cualquier despliegue real; false aqui es solo
# para poder probar en localhost por HTTP.
jwt.cookie.secure=false