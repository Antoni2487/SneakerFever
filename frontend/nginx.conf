# Mismas rutas que proxea Vite en desarrollo (ver vite.config.ts): las APIs del
# backend, las imágenes subidas y los assets estáticos del sitio público.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las imágenes se suben hasta 5 MB (límite del backend).
    client_max_body_size 6m;

    location ~ ^/(api|uploads|web|carrito/api|admin/api|marcas/api|categorias/api|clientes/api|productos/api|usuarios/api|perfiles/api|ventas/api|creditos/api|inventario/api|personalizacion/api)(/|$) {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier otra ruta (/productos, /ventas, /carrito...) la resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre: cache larga sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
